<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>奖励</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h4 class="mb-0">奖励</h4>
        <a class="btn btn-primary" th:href="@{/rewards/new}">＋ 新建奖励</a>
    </div>

    <div class="d-flex align-items-center mb-3">
        <span class="text-muted small me-2">当前积分</span>
        <span class="fs-5 fw-bold app-stat-value" th:text="${currentBalance}">0</span>
    </div>

    <div th:if="${success}" class="alert alert-success py-2 small">✅ <span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert alert-danger py-2 small">⚠️ <span th:text="${error}"></span></div>

    <div class="row g-3">
        <div class="col-6 col-md-4" th:each="r : ${rewards}">
            <div class="card h-100">
                <img th:if="${r.imagePath != null}" th:src="${r.imagePath}" class="card-img-top app-thumb" alt="">
                <div th:if="${r.imagePath == null}" class="card-img-top app-thumb app-thumb-empty">🎁</div>
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start">
                        <span class="fw-medium small" th:text="${r.name}">奖励名</span>
                        <span th:if="${r.type == 'PHYSICAL'}" class="badge bg-light text-secondary flex-shrink-0">📦 实物</span>
                        <span th:if="${r.type == 'ACTIVITY'}" class="badge bg-light text-secondary flex-shrink-0">🎡 活动</span>
                    </div>
                    <div class="d-flex align-items-baseline my-1">
                        <span class="fs-5 fw-bold app-reward-cost" th:text="${r.pointsCost}">100</span>
                        <span class="text-muted small ms-1">分</span>
                        <span th:if="${!r.enabled}" class="badge bg-dark ms-auto">已下架</span>
                    </div>
                    <div class="small text-muted mb-2">
                        <span th:if="${r.stock != null}" th:text="'剩余 ' + ${r.stock} + ' 件'">剩余 5 件</span>
                        <span th:if="${r.stock == null}">不限量</span>
                        <span th:if="${r.stock != null and r.stock <= 0}" class="text-danger ms-1">售罄</span>
                        <span th:if="${r.description}" class="d-block text-truncate" th:text="${r.description}">说明</span>
                    </div>

                    <form th:if="${r.enabled}" th:action="@{'/rewards/' + ${r.id} + '/redeem'}" method="post"
                          class="mt-auto">
                        <button type="submit" class="btn btn-primary w-100"
                                onclick="return confirm('确认兑换？将扣除相应积分')">兑换</button>
                    </form>
                    <button th:if="${!r.enabled}" type="button" class="btn btn-secondary w-100 mt-auto" disabled>已下架</button>

                    <div class="d-flex gap-2 mt-2">
                        <a class="btn btn-sm btn-outline-secondary flex-grow-1" th:href="@{'/rewards/' + ${r.id} + '/edit'}">编辑</a>
                        <form th:action="@{'/rewards/' + ${r.id} + '/toggle'}" method="post" class="flex-grow-1">
                            <button type="submit" class="btn btn-sm w-100"
                                    th:classappend="${r.enabled} ? 'btn-outline-danger' : 'btn-outline-success'"
                                    th:text="${r.enabled} ? '下架' : '上架'"></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(rewards)}" class="text-center text-muted small py-5">
        还没有奖励，点右上角「＋ 新建奖励」创建第一个吧
    </div>
</div>
</body>
</html>
