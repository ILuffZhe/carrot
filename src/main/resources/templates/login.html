<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>登录 · Carrot</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<div class="login-card card shadow-sm border-0">
    <div class="card-body p-4">
        <div class="login-brand text-center">🥕</div>
        <h1 class="fs-4 text-center mb-1 fw-bold">Carrot 家庭积分</h1>
        <p class="text-muted text-center small mb-4">记录成长，积攒好习惯</p>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control form-control-lg" id="username"
                       name="username" placeholder="请输入用户名" required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control form-control-lg" id="password"
                       name="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2 small mb-3">
                用户名或密码错误，请重试。
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2 small mb-3">
                您已安全退出登录。
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">登 录</button>
        </form>
    </div>
</div>
</body>
</html>
