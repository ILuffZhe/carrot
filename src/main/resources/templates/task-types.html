<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>任务类型管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h4 class="mb-0">任务类型管理</h4>
        <a class="btn btn-primary" th:href="@{/task-types/new}">＋ 新建类型</a>
    </div>

    <div th:if="${success}" class="alert alert-success py-2 small">✅ <span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert alert-danger py-2 small">⚠️ <span th:text="${error}"></span></div>

    <!-- 类型列表 -->
    <div class="list-group">
        <div class="list-group-item" th:each="t : ${types}">
            <div class="d-flex justify-content-between align-items-center">
                <div class="me-2">
                    <div class="fw-medium">
                        <span th:if="${t.icon}" th:text="${t.icon}">📚</span>
                        <span th:text="${t.name}">类型名</span>
                        <span th:if="${t.builtin}" class="badge bg-secondary align-middle">内置</span>
                        <span th:if="${!t.enabled}" class="badge bg-dark align-middle">已停用</span>
                    </div>
                    <div class="small text-muted">
                        <span th:if="${t.kind == 'POSITIVE'}"
                              th:text="'完成 ' + ${@pointFormat.fmt(t.basePoints)} + ' · 良好 ' + ${@pointFormat.fmt(t.goodPoints)} + ' · 优秀 ' + ${@pointFormat.fmt(t.excellentPoints)}"></span>
                        <span th:if="${t.kind == 'NEGATIVE'}"
                              th:text="'单次扣 ' + ${@pointFormat.fmt(t.basePoints)} + ' 分'"></span>
                        <span th:if="${t.description}" class="ms-2" th:text="${t.description}"></span>
                    </div>
                </div>
                <div class="d-flex gap-2 flex-shrink-0">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{'/task-types/' + ${t.id} + '/edit'}">编辑</a>
                    <form th:action="@{'/task-types/' + ${t.id} + '/toggle'}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sm"
                                th:classappend="${t.enabled} ? 'btn-outline-secondary' : 'btn-outline-success'"
                                th:text="${t.enabled} ? '停用' : '启用'"></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
